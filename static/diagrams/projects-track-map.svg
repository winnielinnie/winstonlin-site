<svg width="1200" height="760" viewBox="0 0 1200 760" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Projects track map</title>
  <desc id="desc">Diagram showing three repo tracks: workflow checks, reusable artifacts, and OCI Functions starter patterns, each routing to GitHub proof and a short note explaining the standard.</desc>
  <rect width="1200" height="760" rx="36" fill="#F5EFE5"/>
  <rect x="28" y="28" width="1144" height="704" rx="30" fill="#FCF9F4" stroke="#D9CDBE" stroke-width="2"/>

  <circle cx="188" cy="138" r="92" fill="#E6EFEA"/>
  <circle cx="1000" cy="144" r="102" fill="#EFE1D2"/>
  <circle cx="1028" cy="616" r="84" fill="#F1E7D8"/>

  <text x="88" y="114" fill="#7E6337" font-family="Manrope, Arial, sans-serif" font-size="22" font-weight="700">Repo track map</text>
  <text x="88" y="154" fill="#29433F" font-family="Newsreader, Georgia, serif" font-size="50" font-weight="600">Group by the repeated problem</text>
  <text x="88" y="190" fill="#63564A" font-family="Manrope, Arial, sans-serif" font-size="22">The projects page gets stronger when each batch explains what it makes easier, what it leaves behind, and where to click next.</text>

  <rect x="86" y="252" width="308" height="184" rx="26" fill="#F2F7F3" stroke="#BFD0C8" stroke-width="2"/>
  <text x="118" y="304" fill="#28514C" font-family="Manrope, Arial, sans-serif" font-size="22" font-weight="700">Workflow checks</text>
  <text x="118" y="338" fill="#4D5F5A" font-family="Manrope, Arial, sans-serif" font-size="18">Recurring review work</text>
  <text x="118" y="366" fill="#4D5F5A" font-family="Manrope, Arial, sans-serif" font-size="18">turned into something</text>
  <text x="118" y="394" fill="#4D5F5A" font-family="Manrope, Arial, sans-serif" font-size="18">visible and rerunnable.</text>
  <rect x="118" y="320" width="176" height="34" rx="17" fill="#DDEBE5"/>
  <text x="142" y="343" fill="#28514C" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="700">Check, rerun, handoff</text>

  <rect x="446" y="252" width="308" height="184" rx="26" fill="#FFF8F1" stroke="#D3C0AF" stroke-width="2"/>
  <text x="478" y="304" fill="#7A4028" font-family="Manrope, Arial, sans-serif" font-size="22" font-weight="700">Reusable artifacts</text>
  <text x="478" y="338" fill="#5D5147" font-family="Manrope, Arial, sans-serif" font-size="18">Fun projects and small tools</text>
  <text x="478" y="366" fill="#5D5147" font-family="Manrope, Arial, sans-serif" font-size="18">that leave behind an output,</text>
  <text x="478" y="394" fill="#5D5147" font-family="Manrope, Arial, sans-serif" font-size="18">brief, canvas, or digest.</text>
  <rect x="478" y="320" width="196" height="34" rx="17" fill="#F0DFD0"/>
  <text x="504" y="343" fill="#7A4028" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="700">Artifact, export, next step</text>

  <rect x="806" y="252" width="308" height="184" rx="26" fill="#F8F4EC" stroke="#D9CAB5" stroke-width="2"/>
  <text x="838" y="304" fill="#7E6337" font-family="Manrope, Arial, sans-serif" font-size="22" font-weight="700">OCI Functions starter patterns</text>
  <text x="838" y="338" fill="#5F564B" font-family="Manrope, Arial, sans-serif" font-size="18">One visible contract,</text>
  <text x="838" y="366" fill="#5F564B" font-family="Manrope, Arial, sans-serif" font-size="18">one clean boundary,</text>
  <text x="838" y="394" fill="#5F564B" font-family="Manrope, Arial, sans-serif" font-size="18">no fake completeness.</text>
  <rect x="838" y="320" width="206" height="34" rx="17" fill="#EFE5D4"/>
  <text x="862" y="343" fill="#7E6337" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="700">Contract, handoff, stop line</text>

  <rect x="136" y="520" width="268" height="138" rx="24" fill="#183A37"/>
  <text x="168" y="564" fill="#CBE9E1" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="700">GITHUB PROOF</text>
  <text x="168" y="604" fill="#FFFFFF" font-family="Newsreader, Georgia, serif" font-size="38" font-weight="600">Repo examples</text>
  <text x="168" y="634" fill="#D9EEE7" font-family="Manrope, Arial, sans-serif" font-size="18">README, outputs, boundaries, examples.</text>

  <rect x="796" y="520" width="268" height="138" rx="24" fill="#6C361C"/>
  <text x="828" y="564" fill="#FFD9C5" font-family="Manrope, Arial, sans-serif" font-size="18" font-weight="700">SITE CONTEXT</text>
  <text x="828" y="604" fill="#FFF8F2" font-family="Newsreader, Georgia, serif" font-size="38" font-weight="600">Track notes</text>
  <text x="828" y="634" fill="#F5D9CB" font-family="Manrope, Arial, sans-serif" font-size="18">Why the batch is grouped this way.</text>

  <rect x="482" y="496" width="236" height="188" rx="26" fill="#FBF7F1" stroke="#D4C4B3" stroke-width="2"/>
  <text x="514" y="548" fill="#6A4A2E" font-family="Manrope, Arial, sans-serif" font-size="22" font-weight="700">Projects page</text>
  <text x="514" y="584" fill="#5C534A" font-family="Manrope, Arial, sans-serif" font-size="18">Name the batch</text>
  <text x="514" y="612" fill="#5C534A" font-family="Manrope, Arial, sans-serif" font-size="18">Link the standard</text>
  <text x="514" y="640" fill="#5C534A" font-family="Manrope, Arial, sans-serif" font-size="18">Route the next click</text>

  <path d="M240 436V476H600V496" stroke="#8A5B40" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M600 436V496" stroke="#8A5B40" stroke-width="5" stroke-linecap="round"/>
  <path d="M960 436V476H600V496" stroke="#8A5B40" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M482 590H404" stroke="#8A5B40" stroke-width="5" stroke-linecap="round"/>
  <path d="M718 590H796" stroke="#8A5B40" stroke-width="5" stroke-linecap="round"/>

  <circle cx="600" cy="496" r="8" fill="#8A5B40"/>
  <circle cx="404" cy="590" r="8" fill="#8A5B40"/>
  <circle cx="796" cy="590" r="8" fill="#8A5B40"/>

  <text x="88" y="710" fill="#615449" font-family="Manrope, Arial, sans-serif" font-size="20">The projects surface should explain the pattern first, then let GitHub prove it repo by repo.</text>
</svg>
