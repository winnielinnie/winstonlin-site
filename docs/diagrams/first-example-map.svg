<svg width="1200" height="720" viewBox="0 0 1200 720" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Repo track first example map</title>
  <desc id="desc">Three repo tracks each point first to one recommended example before widening into the rest of the batch.</desc>
  <defs>
    <linearGradient id="bg" x1="106" y1="44" x2="1052" y2="676" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FCF7EF"/>
      <stop offset="1" stop-color="#F3ECE1"/>
    </linearGradient>
    <linearGradient id="panelA" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#EEF6F3"/>
      <stop offset="1" stop-color="#FBF7F0"/>
    </linearGradient>
    <linearGradient id="panelB" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFF0E7"/>
      <stop offset="1" stop-color="#FBF5EC"/>
    </linearGradient>
    <linearGradient id="panelC" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F8F1DB"/>
      <stop offset="1" stop-color="#FBF5EC"/>
    </linearGradient>
    <linearGradient id="arrowA" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#4C7A71"/>
      <stop offset="1" stop-color="#98B8B1"/>
    </linearGradient>
    <linearGradient id="arrowB" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#A66044"/>
      <stop offset="1" stop-color="#D7A48B"/>
    </linearGradient>
    <linearGradient id="arrowC" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#A07A34"/>
      <stop offset="1" stop-color="#D5BE7A"/>
    </linearGradient>
    <filter id="shadow" x="0" y="0" width="1200" height="720" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#5C4A3B" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1200" height="720" rx="32" fill="url(#bg)"/>
  <g filter="url(#shadow)">
    <rect x="72" y="70" width="1056" height="580" rx="28" fill="#FFFDF9" fill-opacity="0.82"/>
  </g>

  <text x="96" y="118" fill="#8D5D47" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="2.1">PROJECT ROUTING</text>
  <text x="96" y="164" fill="#1F1916" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-weight="700">Each track needs one best first example.</text>
  <text x="96" y="204" fill="#5E554E" font-family="Arial, Helvetica, sans-serif" font-size="22">The first repo should teach the standard. The rest of the batch should prove it travels.</text>

  <g transform="translate(96 260)">
    <rect width="304" height="304" rx="26" fill="url(#panelA)" stroke="#C6D8D2"/>
    <text x="28" y="42" fill="#4B796E" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="1.5">WORKFLOW CHECKS</text>
    <rect x="28" y="72" width="248" height="70" rx="18" fill="#FFFFFF" stroke="#BFD4CD"/>
    <text x="48" y="100" fill="#1E1916" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">repo-onramp-check</text>
    <text x="48" y="126" fill="#5D564F" font-family="Arial, Helvetica, sans-serif" font-size="15">Best first example</text>
    <path d="M36 174H264" stroke="url(#arrowA)" stroke-width="4" stroke-linecap="round"/>
    <path d="M252 164L272 174L252 184" stroke="url(#arrowA)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="28" y="214" fill="#2B2623" font-family="Arial, Helvetica, sans-serif" font-size="16">doc-ship-check</text>
    <text x="28" y="242" fill="#2B2623" font-family="Arial, Helvetica, sans-serif" font-size="16">release-note-diff-cli</text>
    <text x="28" y="270" fill="#2B2623" font-family="Arial, Helvetica, sans-serif" font-size="16">incident-timeline-formatter</text>
    <text x="28" y="292" fill="#5D564F" font-family="Arial, Helvetica, sans-serif" font-size="14">Teaches the rule: repeated review work</text>
  </g>

  <g transform="translate(448 260)">
    <rect width="304" height="304" rx="26" fill="url(#panelB)" stroke="#E1C8BA"/>
    <text x="28" y="42" fill="#A06044" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="1.5">PLANNING ARTIFACTS</text>
    <rect x="28" y="72" width="248" height="70" rx="18" fill="#FFFFFF" stroke="#E2C5B6"/>
    <text x="48" y="100" fill="#1E1916" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">one-page-canvas</text>
    <text x="48" y="126" fill="#5D564F" font-family="Arial, Helvetica, sans-serif" font-size="15">Best first example</text>
    <path d="M36 174H264" stroke="url(#arrowB)" stroke-width="4" stroke-linecap="round"/>
    <path d="M252 164L272 174L252 184" stroke="url(#arrowB)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="28" y="214" fill="#2B2623" font-family="Arial, Helvetica, sans-serif" font-size="16">decision-journal-cli</text>
    <text x="28" y="242" fill="#2B2623" font-family="Arial, Helvetica, sans-serif" font-size="16">dependency-risk-check</text>
    <text x="28" y="270" fill="#2B2623" font-family="Arial, Helvetica, sans-serif" font-size="16">exec-brief-cli • tiny-deck-linter</text>
    <text x="28" y="292" fill="#5D564F" font-family="Arial, Helvetica, sans-serif" font-size="14">Teaches the rule: leave behind a reusable artifact</text>
  </g>

  <g transform="translate(800 260)">
    <rect width="304" height="304" rx="26" fill="url(#panelC)" stroke="#DACA9B"/>
    <text x="28" y="42" fill="#9E7B37" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="1.5">STARTER PATTERNS</text>
    <rect x="28" y="72" width="248" height="70" rx="18" fill="#FFFFFF" stroke="#D9C78F"/>
    <text x="48" y="100" fill="#1E1916" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">oci-fn-object-storage-router</text>
    <text x="48" y="126" fill="#5D564F" font-family="Arial, Helvetica, sans-serif" font-size="15">Best first example</text>
    <path d="M36 174H264" stroke="url(#arrowC)" stroke-width="4" stroke-linecap="round"/>
    <path d="M252 164L272 174L252 184" stroke="url(#arrowC)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="28" y="214" fill="#2B2623" font-family="Arial, Helvetica, sans-serif" font-size="16">oci-fn-csv-quality-gate</text>
    <text x="28" y="242" fill="#2B2623" font-family="Arial, Helvetica, sans-serif" font-size="16">oci-fn-file-manifest-writer</text>
    <text x="28" y="270" fill="#2B2623" font-family="Arial, Helvetica, sans-serif" font-size="16">queue-worker • webhook • digest</text>
    <text x="28" y="292" fill="#5D564F" font-family="Arial, Helvetica, sans-serif" font-size="14">Teaches the rule: one visible handoff boundary</text>
  </g>
</svg>
