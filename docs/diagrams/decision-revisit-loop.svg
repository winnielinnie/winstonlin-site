<svg width="1200" height="720" viewBox="0 0 1200 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="720" rx="36" fill="#F6F1E8"/>
  <rect x="64" y="72" width="1072" height="576" rx="28" fill="#FFF9F1" stroke="#C9B89B" stroke-width="2"/>
  <text x="96" y="132" fill="#5A4330" font-family="Georgia, serif" font-size="40">Decision logs stay useful when they stay re-openable</text>
  <rect x="112" y="190" width="264" height="154" rx="24" fill="#FDE7C4" stroke="#C88737" stroke-width="2"/>
  <text x="140" y="238" fill="#6C4312" font-family="Arial, sans-serif" font-size="18">Decision record</text>
  <text x="140" y="274" fill="#2B211B" font-family="Arial, sans-serif" font-size="28" font-weight="700">Keep the call legible</text>
  <text x="140" y="312" fill="#4A3B31" font-family="Arial, sans-serif" font-size="18">Owner</text>
  <text x="220" y="312" fill="#4A3B31" font-family="Arial, sans-serif" font-size="18">Assumption</text>
  <text x="140" y="338" fill="#4A3B31" font-family="Arial, sans-serif" font-size="18">Revisit date</text>
  <rect x="468" y="168" width="264" height="196" rx="24" fill="#DDEEE5" stroke="#53896A" stroke-width="2"/>
  <text x="496" y="214" fill="#2F5D46" font-family="Arial, sans-serif" font-size="18">Review pass</text>
  <text x="496" y="250" fill="#1E3429" font-family="Arial, sans-serif" font-size="28" font-weight="700">Pull stale calls forward</text>
  <text x="496" y="290" fill="#335444" font-family="Arial, sans-serif" font-size="18">Open decisions</text>
  <text x="496" y="316" fill="#335444" font-family="Arial, sans-serif" font-size="18">Stale decisions</text>
  <text x="496" y="342" fill="#335444" font-family="Arial, sans-serif" font-size="18">Owner summary</text>
  <rect x="824" y="190" width="264" height="154" rx="24" fill="#E7E1FA" stroke="#735DA7" stroke-width="2"/>
  <text x="852" y="238" fill="#514176" font-family="Arial, sans-serif" font-size="18">Second move</text>
  <text x="852" y="274" fill="#2B2440" font-family="Arial, sans-serif" font-size="28" font-weight="700">Reopen the right call</text>
  <text x="852" y="312" fill="#463E5C" font-family="Arial, sans-serif" font-size="18">Update assumption</text>
  <text x="852" y="338" fill="#463E5C" font-family="Arial, sans-serif" font-size="18">Reconfirm owner</text>
  <rect x="278" y="444" width="644" height="120" rx="26" fill="#FFF" stroke="#D7C9B6" stroke-width="2"/>
  <text x="314" y="490" fill="#6B5846" font-family="Arial, sans-serif" font-size="18">Failure mode</text>
  <text x="314" y="528" fill="#2E241D" font-family="Arial, sans-serif" font-size="30" font-weight="700">Without the revisit date, the log becomes history instead of workflow.</text>
